<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Snake: Neon Overdrive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #080911;
      color: #00ffcc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(14, 16, 28, 0.9);
      border-bottom: 2px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      z-index: 10;
    }
    .title { font-size: 16px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 8px #00ffcc; }
    .scores { display: flex; gap: 16px; font-size: 14px; font-weight: 700; }
    .score-val { color: #fcee0a; text-shadow: 0 0 8px #fcee0a; }

    .canvas-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
    }
    canvas {
      background: #0d0f1a;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
    }

    .game-overlay {
      position: absolute;
      inset: 10px;
      background: rgba(8, 9, 17, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 8px;
      border: 1px solid #ff0055;
    }
    .game-overlay.hidden { display: none; }
    .overlay-title { font-size: 26px; font-weight: 900; color: #ff0055; text-shadow: 0 0 12px #ff0055; letter-spacing: 3px; }
    .overlay-score { font-size: 18px; color: #fff; }
    .cyber-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .cyber-btn:active { transform: scale(0.96); box-shadow: 0 0 25px #ff0055; }

    /* On-Screen D-Pad for Mobile */
    .controls-panel {
      width: 100%;
      max-width: 480px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      z-index: 10;
    }
    .d-btn {
      background: rgba(20, 24, 44, 0.8);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 20px;
      font-weight: 900;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
    }
    .d-btn:active { background: #00ffcc; color: #080911; box-shadow: 0 0 15px #00ffcc; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">CYBER SNAKE // OVERDRIVE</div>
    <div class="scores">
      <div>SCORE: <span id="score" class="score-val">0</span></div>
      <div>BEST: <span id="highScore" class="score-val">0</span></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="overlay" class="game-overlay">
      <div id="overlayTitle" class="overlay-title">SYSTEM READY</div>
      <div id="finalScore" class="overlay-score">Swipe or use D-Pad to move</div>
      <button id="startBtn" class="cyber-btn">START OVERDRIVE</button>
    </div>
  </div>

  <div class="controls-panel">
    <button class="d-btn btn-up" id="btnUp">▲</button>
    <button class="d-btn btn-left" id="btnLeft">◀</button>
    <button class="d-btn btn-down" id="btnDown">▼</button>
    <button class="d-btn btn-right" id="btnRight">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let velocity = {x: 1, y: 0};
    let nextVelocity = {x: 1, y: 0};
    let food = {x: 15, y: 10, pulse: 0};
    let score = 0;
    let highScore = localStorage.getItem('neon_snake_hi') || 0;
    highScoreEl.textContent = highScore;
    let gameLoop = null;
    let isPlaying = false;
    let particles = [];

    // Synthesized Audio via Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color: color
        });
      }
    }

    function startGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      velocity = {x: 1, y: 0};
      nextVelocity = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
      particles = [];
      isPlaying = true;
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
      playBeep(600, 'triangle', 0.1);
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      playBeep(140, 'sawtooth', 0.4);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_snake_hi', highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = "SIGNAL LOST";
      finalScore.textContent = `FINAL SCORE: ${score}`;
      startBtn.textContent = "REBOOT SYSTEM";
      overlay.classList.remove('hidden');
    }

    function setDirection(dx, dy) {
      if (!isPlaying) return;
      // Prevent immediate 180 reverse
      if (dx !== -velocity.x && dy !== -velocity.y) {
        nextVelocity = {x: dx, y: dy};
        if (navigator.vibrate) navigator.vibrate(15);
      }
    }

    function update() {
      velocity = nextVelocity;
      const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

      // Wrap around grid (Cyber warp) or walls
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        createExplosion(snake[0].x, snake[0].y, '#ff0055');
        return gameOver();
      }

      // Check self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        createExplosion(head.x, head.y, '#ff0055');
        return gameOver();
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        createExplosion(food.x, food.y, '#00ffcc');
        playBeep(880, 'sine', 0.08);
        if (navigator.vibrate) navigator.vibrate(30);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background with subtle scanlines
      ctx.fillStyle = '#0a0c16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw faint grid
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw food (pulsing core)
      food.pulse = (food.pulse + 0.1) % (Math.PI * 2);
      const glowSize = Math.sin(food.pulse) * 4;
      ctx.shadowBlur = 15 + glowSize;
      ctx.shadowColor = '#fcee0a';
      ctx.fillStyle = '#fcee0a';
      ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        ctx.shadowBlur = isHead ? 20 : 8;
        ctx.shadowColor = isHead ? '#00f0ff' : '#00ffcc';
        ctx.fillStyle = isHead ? '#ffffff' : (index % 2 === 0 ? '#00ffcc' : '#00b8ff');
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0;

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 3, 3);
          ctx.globalAlpha = 1.0;
        }
      }
    }

    // Touch swipe gestures
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) setDirection(1, 0);
        else if (dx < -30) setDirection(-1, 0);
      } else {
        if (dy > 30) setDirection(0, 1);
        else if (dy < -30) setDirection(0, -1);
      }
    }, {passive: true});

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection(0, -1);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection(0, 1);
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection(-1, 0);
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection(1, 0);
    });

    // Virtual D-pad buttons
    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(1, 0); });
    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
