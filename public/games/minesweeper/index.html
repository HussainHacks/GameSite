<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper: Core Defusal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #07080f;
      color: #00f0ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      padding: 12px;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 16, 28, 0.9);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 10px 16px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }
    .hud-box {
      font-size: 18px;
      font-weight: 900;
      color: #fcee0a;
      text-shadow: 0 0 8px #fcee0a;
      font-family: monospace;
    }
    .mode-btn {
      background: rgba(22, 26, 48, 0.9);
      border: 1px solid #ff007f;
      color: #ff007f;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .mode-btn.flag-active {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 15px #ff007f;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      background: #101222;
      border: 2px solid #00f0ff;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .cell {
      background: #171b33;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }
    .cell:active { transform: scale(0.94); }
    .cell.revealed {
      background: #0a0b16;
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.8);
    }
    .cell.mine { background: #ff0055; box-shadow: 0 0 15px #ff0055; }
    .cell.flagged { color: #fcee0a; text-shadow: 0 0 10px #fcee0a; }

    .c-1 { color: #00f0ff; text-shadow: 0 0 6px #00f0ff; }
    .c-2 { color: #00ff66; text-shadow: 0 0 6px #00ff66; }
    .c-3 { color: #ff007f; text-shadow: 0 0 6px #ff007f; }
    .c-4 { color: #cc33ff; text-shadow: 0 0 6px #cc33ff; }
    .c-5 { color: #fcee0a; text-shadow: 0 0 6px #fcee0a; }

    .reset-btn {
      background: #00f0ff;
      color: #07080f;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: 900;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 0 15px #00f0ff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="hud-box">MINES: <span id="mineCount">10</span></div>
      <button class="mode-btn" id="modeBtn">MODE: REVEAL</button>
      <div class="hud-box">TIME: <span id="timer">000</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <button class="reset-btn" id="resetBtn">RESET DEFUSAL</button>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let isGameOver = false;
    let isFlagMode = false;
    let flagsLeft = MINES;
    let timer = 0;
    let timerInterval = null;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const modeBtn = document.getElementById('modeBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Web Audio Sound Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initBoard() {
      board = [];
      gridEl.innerHTML = '';
      isGameOver = false;
      flagsLeft = MINES;
      mineCountEl.textContent = flagsLeft;
      clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '000';

      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            r, c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            neighborMines: 0
          });

          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.r = r;
          cellEl.dataset.c = c;
          cellEl.addEventListener('click', () => handleCellClick(r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          gridEl.appendChild(cellEl);
        }
        board.push(row);
      }

      // Plant Mines
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].isMine) {
          board[r][c].isMine = true;
          planted++;
        }
      }

      // Calculate Neighbor Numbers
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].neighborMines = count;
          }
        }
      }

      timerInterval = setInterval(() => {
        timer++;
        timerEl.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function handleCellClick(r, c) {
      if (isGameOver) return;
      if (isFlagMode) {
        toggleFlag(r, c);
        return;
      }

      const cell = board[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      if (cell.isMine) {
        // Boom
        revealAllMines();
        isGameOver = true;
        clearInterval(timerInterval);
        beep(120, 'sawtooth', 0.4);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        alert('CORE DETONATION! Game Over.');
        return;
      }

      revealCell(r, c);
      beep(500, 'triangle', 0.05);
      checkWin();
    }

    function revealCell(r, c) {
      const cell = board[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      const el = getCellEl(r, c);
      el.classList.add('revealed');

      if (cell.neighborMines > 0) {
        el.textContent = cell.neighborMines;
        el.classList.add(`c-${cell.neighborMines}`);
      } else {
        // Flood Fill empty spaces
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];
      if (cell.isRevealed) return;

      cell.isFlagged = !cell.isFlagged;
      const el = getCellEl(r, c);
      if (cell.isFlagged) {
        el.classList.add('flagged');
        el.textContent = '🚩';
        flagsLeft--;
        beep(700, 'sine', 0.04);
        if (navigator.vibrate) navigator.vibrate(15);
      } else {
        el.classList.remove('flagged');
        el.textContent = '';
        flagsLeft++;
        beep(400, 'sine', 0.04);
      }
      mineCountEl.textContent = flagsLeft;
      checkWin();
    }

    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) {
            const el = getCellEl(r, c);
            el.classList.add('mine');
            el.textContent = '💣';
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].isRevealed) {
            unrevealedSafe++;
          }
        }
      }

      if (unrevealedSafe === 0) {
        isGameOver = true;
        clearInterval(timerInterval);
        beep(900, 'sine', 0.3);
        if (navigator.vibrate) navigator.vibrate([50, 50, 50, 50]);
        alert(`ALL CORES DEFUSED! Time: ${timer}s`);
      }
    }

    function getCellEl(r, c) {
      return gridEl.children[r * COLS + c];
    }

    modeBtn.addEventListener('click', () => {
      isFlagMode = !isFlagMode;
      if (isFlagMode) {
        modeBtn.classList.add('flag-active');
        modeBtn.textContent = 'MODE: FLAG 🚩';
      } else {
        modeBtn.classList.remove('flag-active');
        modeBtn.textContent = 'MODE: REVEAL';
      }
      beep(600, 'triangle', 0.05);
    });

    resetBtn.addEventListener('click', initBoard);
    initBoard();
  </script>
</body>
</html>
