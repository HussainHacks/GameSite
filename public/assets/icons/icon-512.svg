<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#fcee0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="16 8"/>

  <!-- Cyberpunk Controller Silhouette -->
  <g filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M 140 180 C 180 160, 332 160, 372 180 C 420 204, 444 320, 396 376 C 364 412, 330 380, 290 324 C 270 300, 242 300, 222 324 C 182 380, 148 412, 116 376 C 68 320, 92 204, 140 180 Z" 
          fill="#141729" stroke="url(#neonCyan)" stroke-width="8"/>
    
    <!-- D-Pad Left -->
    <path d="M 160 230 h 20 v -20 h 20 v 20 h 20 v 20 h -20 v 20 h -20 v -20 h -20 Z" 
          fill="#00f0ff"/>
    
    <!-- Action Buttons Right -->
    <circle cx="340" cy="220" r="12" fill="#ff0055"/>
    <circle cx="370" cy="245" r="12" fill="#fcee0a"/>
    <circle cx="310" cy="245" r="12" fill="#00ff66"/>
    <circle cx="340" cy="270" r="12" fill="#00f0ff"/>
    
    <!-- Center Cyber Grid lines -->
    <line x1="230" y1="235" x2="282" y2="235" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="250" x2="282" y2="250" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cyberpunk Tech Accents -->
  <polygon points="40,60 80,60 60,80 40,80" fill="#fcee0a"/>
  <polygon points="472,452 432,452 452,432 472,432" fill="#00f0ff"/>
  <text x="256" y="440" font-family="monospace, sans-serif" font-size="28" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="6">NEON ARCADE</text>
</svg>
